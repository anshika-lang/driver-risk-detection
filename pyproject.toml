[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-risk-detection"
version = "1.0.0"
authors = [
  { name="AI Driver Safety Systems" }
]
description = "AI-Based Driver Behaviour, Fatigue and Risk Detection System using Multimodal CNN, LSTM, and Telematics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.0.0",
    "opencv-python>=4.8.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0.0",
    "pydantic>=2.0.0",
    "joblib>=1.3.0"
]

[project.urls]
"Homepage" = "https://github.com/anshika-lang/driver-risk-detection"
"Bug Tracker" = "https://github.com/anshika-lang/driver-risk-detection/issues"
